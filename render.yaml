services:
  - type: web
    name: procucev-speech-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: procucev-speech-db
          property: connectionString
      - key: WHISPER_MODEL
        value: base
      - key: CORS_ORIGINS
        value: "*"
  - type: web
    name: procucev-speech-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
databases:
  - name: procucev-speech-db
    databaseName: speechdb
    user: speechuser
